server:
  port: 8085

spring:
  application:
    name: ALERTE-SERVICE

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alerte_db}
    username: ${DB_USER:senprix}
    password: ${DB_PASSWORD:senprix}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/senprix/protocol/openid-connect/certs}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Seuils d'alerte configurables
senprix:
  alertes:
    seuil-moyenne: ${SEUIL_MOYENNE:100}
    seuil-eleve: ${SEUIL_ELEVE:200}

# Notif-service et adresse email recevant les alertes. L'hôte est le NOM
# du service dans l'annuaire Eureka, pas une adresse : le RestClient
# @LoadBalanced le résout à chaud vers une instance disponible.
services:
  notif-service-url: ${NOTIF_SERVICE_URL:http://NOTIF-SERVICE}
  admin-notification-email: ${ADMIN_NOTIFICATION_EMAIL:admin.test@dci.sn}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Enregistrement auprès de l'annuaire de services (discovery-service).
# Le service s'y déclare sous son spring.application.name, ce qui permet
# à la gateway de le router dynamiquement via lb://ALERTE-SERVICE.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Enregistre l'adresse IP plutôt que le nom d'hôte : indispensable en
    # conteneur (Docker / Kubernetes), où le hostname interne n'est pas
    # résolvable depuis les autres services.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    sn.dci.senprix.alerte: INFO
    org.hibernate.SQL: WARN