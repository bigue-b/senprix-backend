# =====================================================================
# docker-compose.yml — à placer à la RACINE de ton projet
# (au même niveau que les dossiers user-service, produit-service, etc.)
#
# Lance TOUTE la stack SEN-PRIX en une seule commande :
#   docker-compose up --build
#
# Arrête tout :
#   docker-compose down
#
# Arrête tout ET supprime les données des bases (repart de zéro) :
#   docker-compose down -v
# =====================================================================

version: "3.9"

services:

  # -------------------- BASE DE DONNÉES POSTGRESQL --------------------
  # Un seul conteneur PostgreSQL qui héberge les 7 bases (via le script
  # init-db.sql exécuté automatiquement au premier démarrage).
  postgres:
    image: postgres:15-alpine
    container_name: senprix-postgres
    environment:
      POSTGRES_USER: senprix
      POSTGRES_PASSWORD: senprix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senprix"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------- KEYCLOAK (authentification) --------------------
  # Le realm "senprix" (rôles ADMIN/AGENT_COLLECTE/CONSOMMATEUR + clients
  # senprix-admin-client / senprix-app) est importé automatiquement au
  # démarrage depuis keycloak-import/realm-export.json — plus besoin de
  # reconfigurer Keycloak à la main.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: senprix-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: senprix
      KC_DB_PASSWORD: senprix
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------- RABBITMQ (messagerie asynchrone) --------------------
  # Utilisé par prix-service pour publier les prix suspects (exchange
  # "prix.suspect.exchange") et par alerte-service pour les consommer
  # (queue "alerte.queue") via @RabbitListener. Interface de gestion
  # accessible sur http://localhost:15672 (identifiants guest/guest).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: senprix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------- DISCOVERY-SERVICE (annuaire Eureka) --------------------
  # Annuaire de services dynamique : chaque microservice s'y enregistre au
  # démarrage sous son spring.application.name, et la gateway l'interroge
  # pour router les requêtes via lb://NOM-SERVICE sans URL codée en dur.
  # Tableau de bord : http://localhost:8761
  discovery-service:
    build: ./discovery-service
    container_name: senprix-discovery-service
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------- MICROSERVICES SEN-PRIX --------------------
  # Tous pointent vers l'annuaire via EUREKA_SERVER_URL. La dépendance à
  # discovery-service est volontairement "service_started" et non
  # "service_healthy" : le client Eureka retente son enregistrement
  # périodiquement, un service peut donc démarrer avant l'annuaire.

  user-service:
    build: ./user-service
    container_name: senprix-user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: 0HBq0IKhizVhOyNieLRG2UMtlDHmVIGC
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      discovery-service:
        condition: service_started

  produit-service:
    build: ./produit-service
    container_name: senprix-produit-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/produit_db
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  campagne-service:
    build: ./campagne-service
    container_name: senprix-campagne-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campagne_db
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      # Plus de *_SERVICE_URL ici : les cibles sont des noms de service
      # résolus via Eureka. Les redéfinir écraserait le nom par une
      # adresse fixe et court-circuiterait la répartition de charge.
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      produit-service:
        condition: service_started
      discovery-service:
        condition: service_started

  prix-service:
    build: ./prix-service
    container_name: senprix-prix-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/prix_db
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      # Plus de *_SERVICE_URL ici : les cibles sont des noms de service
      # résolus via Eureka. Les redéfinir écraserait le nom par une
      # adresse fixe et court-circuiterait la répartition de charge.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started

  alerte-service:
    build: ./alerte-service
    container_name: senprix-alerte-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/alerte_db
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      # Plus de NOTIF_SERVICE_URL ici : la cible est un nom de service
      # résolu via Eureka. Le redéfinir écraserait le nom par une adresse
      # fixe et court-circuiterait la répartition de charge.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started

  notif-service:
    build: ./notif-service
    container_name: senprix-notif-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notif_db
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  rapport-service:
    build: ./rapport-service
    container_name: senprix-rapport-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rapport_db
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      # Plus de *_SERVICE_URL ici : les cibles sont des noms de service
      # résolus via Eureka. Les redéfinir écraserait le nom par une
      # adresse fixe et court-circuiterait la répartition de charge.
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started

  export-service:
    build: ./export-service
    container_name: senprix-export-service
    environment:
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/senprix/protocol/openid-connect/certs
      # Plus de *_SERVICE_URL ici : les cibles sont des noms de service
      # résolus via Eureka. Les redéfinir écraserait le nom par une
      # adresse fixe et court-circuiterait la répartition de charge.
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8088:8088"
    # Pas de dépendance à postgres : export-service est stateless (sans base de données)
    depends_on:
      discovery-service:
        condition: service_started

  gateway-service:
    build: ./gateway-service
    container_name: senprix-gateway-service
    # Plus aucune URL de microservice ici : la gateway route via
    # lb://NOM-SERVICE et résout les adresses à chaud depuis l'annuaire
    # Eureka. Ajouter une instance ou changer un port ne nécessite plus
    # de modifier cette configuration.
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    ports:
      - "8090:8090"
    depends_on:
      - discovery-service
      - user-service
      - produit-service
      - campagne-service
      - prix-service
      - alerte-service
      - notif-service
      - rapport-service
      - export-service

volumes:
  postgres_data:
