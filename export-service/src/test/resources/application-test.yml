spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/senprix/protocol/openid-connect/certs

services:
  prix-service-url: http://localhost:8084
  produit-service-url: http://localhost:8082

logging:
  level:
    sn.dci.senprix.export: DEBUG

# Aucun annuaire Eureka ne tourne pendant les tests automatisés :
# le client est désactivé pour éviter les tentatives d'enregistrement
# et les temporisations réseau au démarrage du contexte Spring.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
