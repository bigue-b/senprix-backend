server:
  port: 8090

spring:
  application:
    name: GATEWAY-SERVICE

  # Redis porte les compteurs du RequestRateLimiter (token bucket mis à
  # jour par un script Lua atomique). Le compteur étant partagé, la limite
  # reste globale même avec plusieurs instances de la gateway.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cloud:
    gateway:
      # CORS global : autorise le frontend (quel que soit son origine
      # en développement) à appeler la gateway directement depuis le
      # navigateur, sans configurer CORS séparément dans chaque service.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # Routage DYNAMIQUE : les URIs "lb://NOM-SERVICE" sont résolues à
      # chaud via l'annuaire Eureka (discovery-service). Le nom qui suit
      # lb:// est le spring.application.name du service cible, jamais une
      # adresse : plus aucune URL ni port codé en dur, et la répartition
      # de charge entre instances est automatique.
      routes:
        # ===================== USER-SERVICE =====================
        # Limité : la création et la modification de comptes passent par
        # ici, et chaque appel se répercute sur l'API admin de Keycloak.
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/admin/utilisateurs/**,/api/public/utilisateurs/**,/api/agent/moi
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@utilisateurKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ===================== PRODUIT-SERVICE =====================
        - id: produit-service
          uri: lb://PRODUIT-SERVICE
          predicates:
            - Path=/api/admin/produits/**,/api/public/produits/**,/api/admin/marches/**,/api/public/marches/**

        # ===================== CAMPAGNE-SERVICE =====================
        - id: campagne-service
          uri: lb://CAMPAGNE-SERVICE
          predicates:
            - Path=/api/admin/campagnes/**,/api/public/campagnes/**

        # ===================== PRIX-SERVICE =====================
        # Limité : /api/agent/prix est l'endpoint le plus sollicité de la
        # plateforme (saisie terrain des relevés) et chaque écriture peut
        # déclencher une publication RabbitMQ vers alerte-service.
        - id: prix-service
          uri: lb://PRIX-SERVICE
          predicates:
            - Path=/api/agent/prix/**,/api/public/prix/**,/api/admin/prix/**,/api/admin/audit/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@utilisateurKeyResolver}"
                # 20 req/s par utilisateur. burstCapacity au même niveau
                # que replenishRate donne un plafond strict ; l'augmenter
                # (40 par exemple) tolérerait des pics courts.
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ===================== ALERTE-SERVICE =====================
        - id: alerte-service
          uri: lb://ALERTE-SERVICE
          predicates:
            - Path=/api/admin/alertes/**,/api/public/alertes/**,/api/internal/alertes/**

        # ===================== NOTIF-SERVICE =====================
        - id: notif-service
          uri: lb://NOTIF-SERVICE
          predicates:
            - Path=/api/admin/notifications/**,/api/citoyen/abonnements/**

        # ===================== RAPPORT-SERVICE =====================
        - id: rapport-service
          uri: lb://RAPPORT-SERVICE
          predicates:
            - Path=/api/admin/rapports/**,/api/public/rapports/**

        # ===================== EXPORT-SERVICE =====================
        # Limité : la génération d'un export CSV/Excel interroge
        # prix-service et produit-service puis construit le fichier en
        # mémoire — c'est de loin l'appel le plus coûteux de la stack.
        - id: export-service
          uri: lb://EXPORT-SERVICE
          predicates:
            - Path=/api/admin/exports/**,/api/public/exports/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@utilisateurKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

# La gateway est à la fois cliente de l'annuaire (elle y lit le registre
# pour résoudre les URIs lb://) et enregistrée dedans, ce qui la rend
# visible sur le tableau de bord Eureka au même titre que les autres.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Enregistre l'adresse IP plutôt que le nom d'hôte : indispensable en
    # conteneur (Docker / Kubernetes), où le hostname interne n'est pas
    # résolvable depuis les autres services.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    sn.dci.senprix.gateway: INFO
    org.springframework.cloud.gateway: INFO