spring:
  cloud:
    gateway:
      routes:
        - id: test-service
          uri: http://localhost:${wiremock.server.port:9999}
          predicates:
            - Path=/api/public/test/**

management:
  endpoints:
    web:
      exposure:
        include: health, gateway

logging:
  level:
    sn.dci.senprix.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG

# Aucun annuaire Eureka ne tourne pendant les tests automatisés :
# le client est désactivé pour éviter les tentatives d'enregistrement
# et les temporisations réseau au démarrage du contexte Spring.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
