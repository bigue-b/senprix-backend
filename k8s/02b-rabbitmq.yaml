# =====================================================================
# RabbitMQ — messagerie asynchrone utilisée par prix-service pour
# publier les prix suspects (exchange "prix.suspect.exchange") et par
# alerte-service pour les consommer (queue "alerte.queue") via
# @RabbitListener. Mêmes identifiants et image que docker-compose.yml.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: senprix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          # ATTENTION — ne PAS sonder avec `rabbitmq-diagnostics`.
          #
          # Chaque appel démarre une VM Erlang qui, si le broker n'a pas
          # encore fini de s'amorcer, crée elle-même
          # /var/lib/rabbitmq/.erlang.cookie (mode 400) avant lui. Le
          # processus principal ne peut alors plus le lire
          # (« Error when reading /var/lib/rabbitmq/.erlang.cookie:
          # eacces ») et le conteneur boucle indéfiniment — symptôme
          # observé : CrashLoopBackOff dès le premier démarrage, sur un pod
          # pourtant neuf. Le manifest ne déclarant aucun volume, la seule
          # issue était de recréer le pod jusqu'à gagner la course.
          #
          # Une sonde TCP sur le port AMQP suffit et n'a aucun effet de
          # bord : RabbitMQ n'écoute sur 5672 qu'une fois réellement prêt.
          startupProbe:
            tcpSocket:
              port: 5672
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: senprix
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
