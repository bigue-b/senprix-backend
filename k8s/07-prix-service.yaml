apiVersion: apps/v1
kind: Deployment
metadata:
  name: prix-service
  namespace: senprix
  labels:
    app: prix-service
spec:
  # 1 réplique en fonctionnement courant : sur le cluster local (Docker
  # Desktop), faire tourner deux exemplaires de chaque service saturait
  # le plan de contrôle.
  #
  # Pour une démonstration de répartition de charge, passer ponctuellement
  # à 2 sans modifier ce fichier :
  #   kubectl scale deployment/prix-service -n senprix --replicas=2
  # Les deux pods s'enregistrent alors dans Eureka sous le même nom
  # PRIX-SERVICE avec des instanceId distincts, et Spring Cloud
  # LoadBalancer alterne entre eux — aussi bien pour les routes
  # lb://PRIX-SERVICE de la Gateway que pour les appels inter-services
  # (rapport-service, export-service) via leur RestClient @LoadBalanced.
  # Résultats mesurés : voir TESTS_END_TO_END.md.
  replicas: 1
  selector:
    matchLabels:
      app: prix-service
  template:
    metadata:
      labels:
        app: prix-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: prix-service
          image: senprix/prix-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/prix_db"
            - name: KEYCLOAK_JWK_URI
              value: "http://keycloak:8080/realms/senprix/protocol/openid-connect/certs"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"
            # Adresse de l'annuaire Eureka : le service s'y enregistre au
            # démarrage pour être routable par la gateway via lb://NOM-SERVICE.
            - name: EUREKA_SERVER_URL
              value: "http://discovery-service:8761/eureka/"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            # 150 x 5s = 12min 30s. Avec 2 répliques qui démarrent en
            # parallèle sur un cluster local, le seuil précédent (60 x 5s
            # = 5 min) expirait avant la fin du démarrage : le pod était
            # tué par SIGTERM et repartait en boucle.
            failureThreshold: 150
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              # 2000m et non 500m : le démarrage d'une JVM Spring Boot est
              # très gourmand en CPU sur une courte durée. Bridé à 500m
              # (une demi-cœur), le seul contexte web mettait déjà ~58 s et
              # le démarrage complet dépassait le startupProbe. La limite
              # ne contraint que les pics : au repos le pod consomme
              # toujours de l'ordre de la requests (100m).
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: prix-service
  namespace: senprix
spec:
  selector:
    app: prix-service
  ports:
    - port: 8084
      targetPort: 8084
