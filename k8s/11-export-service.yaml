apiVersion: apps/v1
kind: Deployment
metadata:
  name: export-service
  namespace: senprix
  labels:
    app: export-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: export-service
  template:
    metadata:
      labels:
        app: export-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: export-service
          image: senprix/export-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: KEYCLOAK_JWK_URI
              value: "http://keycloak:8080/realms/senprix/protocol/openid-connect/certs"
            # Adresse de l'annuaire Eureka : le service s'y enregistre au
            # démarrage pour être routable par la gateway via lb://NOM-SERVICE.
            - name: EUREKA_SERVER_URL
              value: "http://discovery-service:8761/eureka/"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            # 150 x 5s : sur un cluster local, une JVM Spring Boot peut
            # dépasser les 5 min du seuil précédent et être tuée en boucle.
            failureThreshold: 150
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              # Le démarrage JVM est un pic CPU court mais intense : bridé
              # à 500m, il dépasse le startupProbe. Ne contraint que les pics.
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: export-service
  namespace: senprix
spec:
  selector:
    app: export-service
  ports:
    - port: 8088
      targetPort: 8088
