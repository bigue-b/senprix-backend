apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: senprix
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: gateway-service
          image: senprix/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          # Plus aucune URL de microservice ici : les routes sont définies
          # en lb://NOM-SERVICE et résolues à chaud depuis l'annuaire
          # Eureka. Monter le nombre de répliques d'un service suffit à le
          # mettre en répartition de charge, sans toucher à ce manifest.
          env:
            - name: EUREKA_SERVER_URL
              value: "http://discovery-service:8761/eureka/"
            # Redis porte les compteurs du RequestRateLimiter (voir
            # 02c-redis.yaml et RateLimitConfig côté gateway).
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            # 150 x 5s : sur un cluster local, une JVM Spring Boot peut
            # dépasser les 5 min du seuil précédent et être tuée en boucle.
            failureThreshold: 150
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              # Le démarrage JVM est un pic CPU court mais intense : bridé
              # à 500m, il dépasse le startupProbe. Ne contraint que les pics.
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: senprix
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8090
      targetPort: 8090
