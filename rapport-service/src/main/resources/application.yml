server:
  port: 8087

spring:
  application:
    name: RAPPORT-SERVICE

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rapport_db}
    username: ${DB_USER:senprix}
    password: ${DB_PASSWORD:senprix}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Le schéma est géré par Liquibase, pas par Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/senprix/protocol/openid-connect/certs}

# Microservices distants appelés pour la génération des rapports.
# L'hôte est le NOM du service dans l'annuaire Eureka, pas une adresse :
# le RestClient @LoadBalanced le résout à chaud vers une instance
# disponible.
services:
  prix-service-url: ${PRIX_SERVICE_URL:http://PRIX-SERVICE}
  produit-service-url: ${PRODUIT_SERVICE_URL:http://PRODUIT-SERVICE}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Enregistrement auprès de l'annuaire de services (discovery-service).
# Le service s'y déclare sous son spring.application.name, ce qui permet
# à la gateway de le router dynamiquement via lb://RAPPORT-SERVICE.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Enregistre l'adresse IP plutôt que le nom d'hôte : indispensable en
    # conteneur (Docker / Kubernetes), où le hostname interne n'est pas
    # résolvable depuis les autres services.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    sn.dci.senprix.rapport: INFO
    org.hibernate.SQL: WARN
